name: Telegram Alerting Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type test-telegram-alerting to verify emergency routes and the alert gateway
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-alerting-smoke-test
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_twc_token: ${{ secrets.TIMEWEB_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: /tmp/core-platform.kubeconfig
    steps:
      - uses: actions/checkout@v6

      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "test-telegram-alerting" ]; then
            echo "::error::Confirmation must be exactly test-telegram-alerting"
            exit 1
          fi

      - name: Install CLI tools
        run: |
          set -euo pipefail
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://packages.opentofu.org/opentofu/tofu/gpgkey \
            | sudo gpg --no-tty --batch --dearmor -o /etc/apt/keyrings/opentofu-repo.gpg
          sudo chmod a+r /etc/apt/keyrings/opentofu-repo.gpg
          echo "deb [signed-by=/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main" \
            | sudo tee /etc/apt/sources.list.d/opentofu.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y tofu
          kubectl_version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig from OpenTofu state
        working-directory: opentofu/envs/production
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu output -raw core_platform_kubeconfig > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

      - name: Test VPN and direct notification routes
        run: |
          set -euo pipefail

          kubectl -n observability rollout status deployment/telegram-vpn --timeout=10m
          kubectl -n observability rollout status deployment/telegram-egress --timeout=10m
          kubectl -n observability rollout status statefulset/alertmanager --timeout=10m

          kubectl -n observability port-forward service/alertmanager 19093:9093 >/tmp/alertmanager-port-forward.log 2>&1 &
          port_forward_pid="$!"
          cleanup() {
            set +e
            kill "$port_forward_pid" >/dev/null 2>&1 || true
            kubectl -n observability rollout restart deployment/telegram-egress >/dev/null
            kubectl -n observability rollout status deployment/telegram-egress --timeout=10m
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19093/-/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:19093/-/ready >/dev/null

          metric_sum() {
            local metric_name="$1"
            curl -fsS http://127.0.0.1:19093/metrics \
              | awk -v metric_name="$metric_name" \
                '$1 ~ ("^" metric_name "\\{") && $1 ~ /integration="telegram"/ { total += $2 } END { printf "%.0f", total + 0 }'
          }

          successful_notification_sum() {
            local notifications
            local failures
            notifications="$(metric_sum alertmanager_notifications_total)"
            failures="$(metric_sum alertmanager_notifications_failed_total)"
            echo $((notifications - failures))
          }

          send_test_alert() {
            local route="$1"
            local summary="$2"
            local starts_at
            local ends_at
            starts_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ends_at="$(date -u -d '+2 minutes' +%Y-%m-%dT%H:%M:%SZ)"

            jq -n \
              --arg route "$route" \
              --arg summary "$summary" \
              --arg starts_at "$starts_at" \
              --arg ends_at "$ends_at" \
              '[{
                labels: {
                  alertname: "TelegramAlertingSmokeTest",
                  severity: "info",
                  instance: "github-actions",
                  telegram_route_test: $route
                },
                annotations: {
                  summary: $summary,
                  description: "End-to-end Alertmanager delivery smoke test."
                },
                startsAt: $starts_at,
                endsAt: $ends_at,
                generatorURL: "https://github.com/panixida-infrastructure/core-platform/actions"
              }]' \
              | curl -fsS -X POST \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  http://127.0.0.1:19093/api/v2/alerts
          }

          wait_for_notification() {
            local previous_successful="$1"
            for _ in $(seq 1 60); do
              current_successful="$(successful_notification_sum)"
              if [ "$current_successful" -gt "$previous_successful" ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          successful_before="$(successful_notification_sum)"
          failures_before="$(metric_sum alertmanager_notifications_failed_total)"

          vpn_test_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          send_test_alert vpn "Telegram notification delivered through WireGuard proxy."
          wait_for_notification "$successful_before"
          successful_after_vpn="$(successful_notification_sum)"
          proxy_logs="$(kubectl -n observability logs \
            -l app.kubernetes.io/name=telegram-egress \
            -c squid \
            --prefix=true \
            --since-time="$vpn_test_started_at")"
          grep -Eq '(FIRSTUP|HIER|DEFAULT)_PARENT' <<<"$proxy_logs"

          direct_test_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          send_test_alert direct "Telegram notification delivered through direct fallback."
          wait_for_notification "$successful_after_vpn"
          direct_logs="$(kubectl -n observability logs \
            -l app.kubernetes.io/name=telegram-egress \
            -c squid \
            --prefix=true \
            --since-time="$direct_test_started_at")"
          grep -q 'HIER_DIRECT' <<<"$direct_logs"

          failures_after="$(metric_sum alertmanager_notifications_failed_total)"
          if [ "$failures_after" -ne "$failures_before" ]; then
            echo "::error::Telegram notification failure counter increased from ${failures_before} to ${failures_after}"
            exit 1
          fi

          echo "VPN and direct fallback Telegram notifications were delivered successfully."

      - name: Test alert gateway delivery, idempotency, and log ingestion
        run: |
          set -euo pipefail

          kubectl -n observability rollout status deployment/telegram-alert-gateway --timeout=10m
          kubectl -n observability rollout status statefulset/alertmanager --timeout=10m

          kubectl -n observability port-forward service/telegram-alert-gateway 18080:80 >/tmp/telegram-alert-gateway-port-forward.log 2>&1 &
          gateway_port_forward_pid="$!"
          kubectl -n observability port-forward service/alertmanager 19093:9093 >/tmp/alertmanager-gateway-port-forward.log 2>&1 &
          alertmanager_port_forward_pid="$!"
          smoke_namespace="alert-gateway-smoke"
          cleanup() {
            set +e
            kill "$gateway_port_forward_pid" "$alertmanager_port_forward_pid" >/dev/null 2>&1 || true
            kubectl delete namespace "$smoke_namespace" --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health/ready >/dev/null \
              && curl -fsS http://127.0.0.1:19093/-/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health/ready >/dev/null
          curl -fsS http://127.0.0.1:19093/-/ready >/dev/null

          webhook_token="$(kubectl -n observability get secret telegram-alert-gateway-env -o jsonpath='{.data.Webhook__Token}' | base64 -d)"
          test_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          alert_starts_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          alert_ends_at="$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          fingerprint="gateway-smoke-$(date -u +%s)"
          gateway_payload="$(jq -n \
            --arg starts_at "$alert_starts_at" \
            --arg fingerprint "$fingerprint" \
            '{
              status: "firing",
              externalUrl: "https://github.com/panixida-infrastructure/core-platform/actions",
              alerts: [{
                status: "firing",
                labels: {
                  alertname: "TelegramAlertGatewaySmokeTest",
                  severity: "info",
                  alert_owner: "unclassified-tests"
                },
                annotations: {
                  summary: "Alert gateway delivery and idempotency smoke test."
                },
                startsAt: $starts_at,
                generatorUrl: "https://github.com/panixida-infrastructure/core-platform/actions",
                fingerprint: $fingerprint
              }]
            }')"

          first_response="$(curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${webhook_token}" \
            --data-binary "$gateway_payload" \
            http://127.0.0.1:18080/api/v1/webhooks/alertmanager)"
          retry_response="$(curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${webhook_token}" \
            --data-binary "$gateway_payload" \
            http://127.0.0.1:18080/api/v1/webhooks/alertmanager)"

          if [ "$(jq -r '.queued' <<<"$first_response")" != "1" ] \
            || [ "$(jq -r '.queued' <<<"$retry_response")" != "0" ]; then
            echo "::error::Gateway webhook retry was not idempotent"
            exit 1
          fi

          delivery_count() {
            kubectl -n observability logs deployment/telegram-alert-gateway --since-time="$test_started_at" \
              | grep -c 'was sent to topic unclassified-tests' || true
          }

          wait_for_delivery_after() {
            local previous_count="$1"
            local attempts="${2:-90}"
            for _ in $(seq 1 "$attempts"); do
              if [ "$(delivery_count)" -gt "$previous_count" ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          wait_for_delivery_after 0
          direct_delivery_count="$(delivery_count)"

          jq -n \
            --arg starts_at "$alert_starts_at" \
            --arg ends_at "$alert_ends_at" \
            '[{
              labels: {
                alertname: "AlertmanagerGatewaySmokeTest",
                severity: "info",
                alert_owner: "unclassified-tests",
                instance: "github-actions"
              },
              annotations: {
                summary: "Alertmanager webhook delivery to the alert gateway."
              },
              startsAt: $starts_at,
              endsAt: $ends_at,
              generatorURL: "https://github.com/panixida-infrastructure/core-platform/actions"
            }]' \
            | curl -fsS -X POST \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                http://127.0.0.1:19093/api/v2/alerts

          wait_for_delivery_after "$direct_delivery_count"
          alertmanager_delivery_count="$(delivery_count)"

          kubectl create namespace "$smoke_namespace" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$smoke_namespace" run log-smoke \
            --image=busybox:1.36.1 \
            --restart=Never \
            --command -- /bin/sh -c 'sleep 30; echo "ERROR telegram alert gateway VictoriaLogs smoke test"; sleep 10'
          kubectl -n "$smoke_namespace" wait --for=jsonpath='{.status.phase}'=Succeeded pod/log-smoke --timeout=3m

          wait_for_delivery_after "$alertmanager_delivery_count" 180
          echo "Gateway webhook, Alertmanager integration, and VictoriaLogs ingestion were delivered successfully."
