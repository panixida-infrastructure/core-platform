name: Telegram Alerting Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type test-telegram-alerting to send VPN and direct fallback test notifications
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-alerting-smoke-test
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_twc_token: ${{ secrets.TIMEWEB_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: /tmp/core-platform.kubeconfig
    steps:
      - uses: actions/checkout@v6

      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "test-telegram-alerting" ]; then
            echo "::error::Confirmation must be exactly test-telegram-alerting"
            exit 1
          fi

      - name: Install CLI tools
        run: |
          set -euo pipefail
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://packages.opentofu.org/opentofu/tofu/gpgkey \
            | sudo gpg --no-tty --batch --dearmor -o /etc/apt/keyrings/opentofu-repo.gpg
          sudo chmod a+r /etc/apt/keyrings/opentofu-repo.gpg
          echo "deb [signed-by=/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main" \
            | sudo tee /etc/apt/sources.list.d/opentofu.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y tofu
          kubectl_version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig from OpenTofu state
        working-directory: opentofu/envs/production
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu output -raw core_platform_kubeconfig > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

      - name: Test VPN and direct notification routes
        run: |
          set -euo pipefail

          kubectl -n observability rollout status deployment/telegram-vpn --timeout=10m
          kubectl -n observability rollout status deployment/telegram-egress --timeout=10m
          kubectl -n observability rollout status statefulset/alertmanager --timeout=10m

          kubectl -n observability port-forward service/alertmanager 19093:9093 >/tmp/alertmanager-port-forward.log 2>&1 &
          port_forward_pid="$!"
          cleanup() {
            set +e
            kill "$port_forward_pid" >/dev/null 2>&1 || true
            kubectl -n observability rollout restart deployment/telegram-egress >/dev/null
            kubectl -n observability rollout status deployment/telegram-egress --timeout=10m
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19093/-/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:19093/-/ready >/dev/null

          metric_sum() {
            local metric_name="$1"
            curl -fsS http://127.0.0.1:19093/metrics \
              | awk -v metric_name="$metric_name" \
                '$1 ~ ("^" metric_name "\\{") && $1 ~ /integration="telegram"/ { total += $2 } END { printf "%.0f", total + 0 }'
          }

          send_test_alert() {
            local route="$1"
            local summary="$2"
            local starts_at
            local ends_at
            starts_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ends_at="$(date -u -d '+2 minutes' +%Y-%m-%dT%H:%M:%SZ)"

            jq -n \
              --arg route "$route" \
              --arg summary "$summary" \
              --arg starts_at "$starts_at" \
              --arg ends_at "$ends_at" \
              '[{
                labels: {
                  alertname: "TelegramAlertingSmokeTest",
                  severity: "info",
                  instance: "github-actions",
                  telegram_route_test: $route
                },
                annotations: {
                  summary: $summary,
                  description: "End-to-end Alertmanager delivery smoke test."
                },
                startsAt: $starts_at,
                endsAt: $ends_at,
                generatorURL: "https://github.com/panixida-infrastructure/core-platform/actions"
              }]' \
              | curl -fsS -X POST \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  http://127.0.0.1:19093/api/v2/alerts
          }

          wait_for_notification() {
            local previous_total="$1"
            for _ in $(seq 1 60); do
              current_total="$(metric_sum alertmanager_notifications_total)"
              if [ "$current_total" -gt "$previous_total" ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          notifications_before="$(metric_sum alertmanager_notifications_total)"
          failures_before="$(metric_sum alertmanager_notifications_failed_total)"

          send_test_alert vpn "Telegram notification delivered through WireGuard proxy."
          wait_for_notification "$notifications_before"
          notifications_after_vpn="$(metric_sum alertmanager_notifications_total)"

          send_test_alert direct "Telegram notification delivered through direct fallback."
          wait_for_notification "$notifications_after_vpn"
          direct_logs="$(kubectl -n observability logs \
            -l app.kubernetes.io/name=telegram-egress \
            --all-containers=true \
            --prefix=true \
            --since=3m)"
          grep -q 'HIER_DIRECT' <<<"$direct_logs"

          failures_after="$(metric_sum alertmanager_notifications_failed_total)"
          if [ "$failures_after" -ne "$failures_before" ]; then
            echo "::error::Telegram notification failure counter increased from ${failures_before} to ${failures_after}"
            exit 1
          fi

          echo "VPN and direct fallback Telegram notifications were delivered successfully."
