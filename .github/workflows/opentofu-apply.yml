name: OpenTofu Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type apply-production to apply the current production OpenTofu configuration
        required: true
        type: string
      skip_refresh:
        description: Skip state refresh when the Timeweb API has a read-only provider incident
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: opentofu-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_twc_token: ${{ secrets.TIMEWEB_TOKEN }}
  TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentofu/envs/production
    steps:
      - uses: actions/checkout@v7

      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "apply-production" ]; then
            echo "::error::Confirmation must be exactly apply-production"
            exit 1
          fi

      - name: Install OpenTofu
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://packages.opentofu.org/opentofu/tofu/gpgkey \
            | sudo gpg --no-tty --batch --dearmor -o /etc/apt/keyrings/opentofu-repo.gpg
          sudo chmod a+r /etc/apt/keyrings/opentofu-repo.gpg
          echo "deb [signed-by=/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main" \
            | sudo tee /etc/apt/sources.list.d/opentofu.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y tofu

      - name: Check required secrets
        run: |
          set -euo pipefail
          for name in TF_VAR_twc_token TIMEWEB_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not available"
              exit 1
            fi
          done

      - name: Init
        run: tofu init -input=false

      - name: Reconcile Timeweb projects
        run: bash ../../../scripts/timeweb/reconcile-core-platform-project.sh

      - name: Reconcile OpenTofu state
        run: bash ../../scripts/reconcile-production-state.sh

      - name: Remove retired SSH key from state
        run: |
          if tofu state list | grep -Fxq twc_ssh_key.oldstrategyforge_245799; then
            tofu state rm twc_ssh_key.oldstrategyforge_245799
          fi

      - name: Plan
        run: |
          plan_args=(-input=false -no-color -out=production.tfplan)
          if [ "${{ inputs.skip_refresh }}" = "true" ]; then
            plan_args+=(-refresh=false)
          fi
          tofu plan "${plan_args[@]}"

      - name: Apply
        run: tofu apply -input=false -auto-approve production.tfplan

      - name: Reconcile and verify managed master resources
        run: |
          set -euo pipefail
          cluster_id="$(tofu output -json timeweb_inventory | jq -er '.kubernetes.id')"
          master_preset_id="$(tofu show -json production.tfplan | jq -er '
            .planned_values.root_module.resources[]
            | select(.address == "twc_k8s_cluster.core_platform")
            | .values.preset_id')"
          bash ../../scripts/reconcile-k8s-master-preset.sh "$cluster_id" "$master_preset_id"

      - name: Install kubectl for the Valkey connectivity check
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Verify managed Valkey and publish its credentials to OpenBao
        run: |
          set -euo pipefail
          umask 077
          export KUBECONFIG="$(mktemp)"
          trap 'rm -f "$KUBECONFIG"' EXIT
          tofu output -raw core_platform_kubeconfig > "$KUBECONFIG"
          export VALKEY_CONFIG="$(tofu output -json managed_valkey)"
          export VALKEY_DEFAULT_PASSWORD="$(tofu output -raw managed_valkey_password)"
          export VALKEY_USER_PASSWORDS="$(tofu output -json managed_valkey_user_passwords)"
          echo "::add-mask::${VALKEY_DEFAULT_PASSWORD}"
          python3 -B ../../../scripts/timeweb/sync-managed-valkey.py
