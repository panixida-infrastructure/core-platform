name: SonarQube runtime image

on:
  pull_request:
    paths:
      - images/sonarqube/**
      - .github/workflows/sonarqube-image.yml
  push:
    branches: [main]
    paths:
      - images/sonarqube/**
      - .github/workflows/sonarqube-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: images/sonarqube
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/panixida-infrastructure/core-platform/sonarqube:${{ github.sha }}
