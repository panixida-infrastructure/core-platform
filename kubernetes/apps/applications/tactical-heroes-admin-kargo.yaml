apiVersion: v1
kind: Namespace
metadata:
  name: tactical-heroes-admin
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: tactical-heroes-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: tactical-heroes-admin
  namespace: tactical-heroes-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  promotionPolicies:
    - stageSelector:
        name: development
      autoPromotionEnabled: true
    - stageSelector:
        name: production
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: update-helm-image
  namespace: tactical-heroes-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  vars:
    - name: gitRepo
    - name: targetBranch
    - name: valuesFile
    - name: argocdApp
    - name: imageRepo
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - branch: ${{ vars.targetBranch }}
            path: ./repo
    - uses: yaml-update
      as: update-image
      config:
        path: ./repo/${{ vars.valuesFile }}
        updates:
          - key: image.tag
            value: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      as: commit
      config:
        path: ./repo
        message: "chore: promote ${{ ctx.stage }} image"
    - uses: git-push
      config:
        path: ./repo
    - uses: argocd-update
      config:
        apps:
          - name: ${{ vars.argocdApp }}
            namespace: argocd
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: tactical-heroes-admin-development
  namespace: tactical-heroes-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  interval: 2m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/panixida/tactical-heroes/admin
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^development-[0-9]+$
        discoveryLimit: 20
        strictSemvers: true
        cacheByTag: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: tactical-heroes-admin-production
  namespace: tactical-heroes-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  interval: 2m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/panixida/tactical-heroes/admin
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^production-[0-9]+$
        discoveryLimit: 20
        strictSemvers: true
        cacheByTag: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: development
  namespace: tactical-heroes-admin
  labels:
    environment: development
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: tactical-heroes-admin-development
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: update-helm-image
          vars:
            - name: gitRepo
              value: https://github.com/tactical-heroes/admin.git
            - name: targetBranch
              value: development
            - name: valuesFile
              value: deploy/helm/tactical-heroes-admin/images-development.yaml
            - name: argocdApp
              value: tactical-heroes-admin-development
            - name: imageRepo
              value: ghcr.io/panixida/tactical-heroes/admin
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: tactical-heroes-admin
  labels:
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: tactical-heroes-admin-production
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: update-helm-image
          vars:
            - name: gitRepo
              value: https://github.com/tactical-heroes/admin.git
            - name: targetBranch
              value: main
            - name: valuesFile
              value: deploy/helm/tactical-heroes-admin/images-production.yaml
            - name: argocdApp
              value: tactical-heroes-admin-production
            - name: imageRepo
              value: ghcr.io/panixida/tactical-heroes/admin
