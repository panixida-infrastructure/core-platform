apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tactical-heroes-development
  namespace: argocd
  labels:
    app.kubernetes.io/name: tactical-heroes
    app.kubernetes.io/part-of: tactical-heroes
    environment: development
  annotations:
    kargo.akuity.io/authorized-stage: tactical-heroes:development
spec:
  project: default
  sources:
    - repoURL: https://github.com/panixida-infrastructure/ci-cd.git
      targetRevision: main
      path: charts/application
      helm:
        releaseName: tactical-heroes-api-development
        valueFiles:
          - $values/deploy/helm/tactical-heroes-api/values.yaml
          - $values/deploy/helm/tactical-heroes-api/values-development.yaml
          - $values/deploy/helm/tactical-heroes-api/images-development.yaml
    - repoURL: https://github.com/tactical-heroes/api.git
      targetRevision: development
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tactical-heroes-development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tactical-heroes-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: tactical-heroes
    app.kubernetes.io/part-of: tactical-heroes
    environment: production
  annotations:
    kargo.akuity.io/authorized-stage: tactical-heroes:production
spec:
  project: default
  sources:
    - repoURL: https://github.com/panixida-infrastructure/ci-cd.git
      targetRevision: main
      path: charts/application
      helm:
        releaseName: tactical-heroes-api-production
        valueFiles:
          - $values/deploy/helm/tactical-heroes-api/values.yaml
          - $values/deploy/helm/tactical-heroes-api/values-production.yaml
          - $values/deploy/helm/tactical-heroes-api/images-production.yaml
    - repoURL: https://github.com/tactical-heroes/api.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tactical-heroes-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
