{{- if .Values.observability.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
      app.kubernetes.io/part-of: core-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/part-of: core-platform
      annotations:
        checksum/observability-config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: vmalert
          image: {{ .Values.observability.images.vmalert | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - -rule=/etc/vmalert/rules.yml
            - -datasource.url=http://victoriametrics.observability.svc.cluster.local:8428
            - -datasource.basicAuth.username=$(OBSERVABILITY_VM_REMOTE_WRITE_USERNAME)
            - -datasource.basicAuth.password=$(OBSERVABILITY_VM_REMOTE_WRITE_PASSWORD)
            - -notifier.url=http://alertmanager.observability.svc.cluster.local:9093
          envFrom:
            - secretRef:
                name: {{ .Values.observability.secretName }}
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
          resources:
            {{- toYaml .Values.observability.resources.vmalert | nindent 12 }}
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert-logs
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: vmalert-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert-logs
      app.kubernetes.io/part-of: core-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert-logs
        app.kubernetes.io/part-of: core-platform
      annotations:
        checksum/observability-config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: vmalert
          image: {{ .Values.observability.images.vmalert | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - -rule=/etc/vmalert/rules.yml
            - -datasource.url=http://victorialogs.observability.svc.cluster.local:9428
            - -datasource.basicAuth.username=$(OBSERVABILITY_VM_REMOTE_WRITE_USERNAME)
            - -datasource.basicAuth.password=$(OBSERVABILITY_VM_REMOTE_WRITE_PASSWORD)
            - -notifier.url=http://alertmanager.observability.svc.cluster.local:9093
          envFrom:
            - secretRef:
                name: {{ .Values.observability.secretName }}
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
          resources:
            {{- toYaml .Values.observability.resources.vmalert | nindent 12 }}
      volumes:
        - name: rules
          configMap:
            name: vmalert-log-rules
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-vpn
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-vpn
spec:
  replicas: {{ .Values.observability.telegramEgress.vpnReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-vpn
      app.kubernetes.io/part-of: core-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-vpn
        app.kubernetes.io/part-of: core-platform
    spec:
      containers:
        - name: gluetun
          image: {{ .Values.observability.images.gluetun | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: custom
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_IMPLEMENTATION
              value: userspace
            - name: HTTPPROXY
              value: "on"
            - name: HTTPPROXY_LISTENING_ADDRESS
              value: :8888
            - name: HTTPPROXY_LOG
              value: "on"
            - name: HTTPPROXY_STEALTH
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8888,9999"
            - name: HEALTH_SERVER_ADDRESS
              value: 0.0.0.0:9999
            - name: HEALTH_RESTART_VPN
              value: "on"
            - name: HEALTH_TARGET_ADDRESSES
              value: api.telegram.org:443
            - name: DNS_SERVER
              value: "on"
            - name: DNS_UPSTREAM_RESOLVER_TYPE
              value: doh
            - name: DNS_UPSTREAM_RESOLVERS
              value: cloudflare,google
            - name: LOG_LEVEL
              value: info
          ports:
            - name: proxy
              containerPort: 8888
            - name: health
              containerPort: 9999
          startupProbe:
            httpGet:
              path: /
              port: health
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: health
            failureThreshold: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: health
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: wireguard
              mountPath: /gluetun/wireguard/wg0.conf
              subPath: wg0.conf
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
          resources:
            {{- toYaml .Values.observability.resources.telegramVpn | nindent 12 }}
      volumes:
        - name: wireguard
          secret:
            secretName: {{ .Values.observability.secretName }}
            items:
              - key: OBSERVABILITY_WIREGUARD_CONF
                path: wg0.conf
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-vpn
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-vpn
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telegram-vpn
    app.kubernetes.io/part-of: core-platform
  ports:
    - name: proxy
      port: 8888
      targetPort: proxy
    - name: health
      port: 9999
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-egress
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-egress
spec:
  replicas: {{ .Values.observability.telegramEgress.proxyReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-egress
      app.kubernetes.io/part-of: core-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-egress
        app.kubernetes.io/part-of: core-platform
      annotations:
        checksum/observability-config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 13
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: telegram-egress
                    app.kubernetes.io/part-of: core-platform
      containers:
        - name: squid
          image: {{ .Values.observability.images.squid | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - -N
            - -f
            - /etc/squid/squid.conf
          ports:
            - name: proxy
              containerPort: 8888
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -s /tmp/squid.pid && kill -0 "$(cat /tmp/squid.pid)"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -s /tmp/squid.pid && kill -0 "$(cat /tmp/squid.pid)"
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETGID
                - SETUID
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
            - name: logs
              mountPath: /var/log/squid
          resources:
            {{- toYaml .Values.observability.resources.telegramEgress | nindent 12 }}
        - name: log-forwarder
          image: {{ .Values.observability.images.busybox | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              touch /var/log/squid/access.log /var/log/squid/cache.log
              tail -q -n +1 -F /var/log/squid/access.log /var/log/squid/cache.log
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 13
            runAsGroup: 13
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: logs
              mountPath: /var/log/squid
          resources:
            {{- toYaml .Values.observability.resources.telegramEgressLogForwarder | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: telegram-egress
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-egress
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-egress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telegram-egress
    app.kubernetes.io/part-of: core-platform
  ports:
    - name: proxy
      port: 8888
      targetPort: proxy
---
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" .Values.observability.persistence.enabled }}
metadata:
  name: alertmanager
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: alertmanager
spec:
  {{- if .Values.observability.persistence.enabled }}
  serviceName: alertmanager
  {{- end }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/part-of: core-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: core-platform
      annotations:
        checksum/observability-config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: alertmanager
          image: {{ .Values.observability.images.alertmanager | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --log.level=error
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: secrets
              mountPath: /etc/alertmanager-secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            {{- toYaml .Values.observability.resources.alertmanager | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: alertmanager
        - name: secrets
          secret:
            secretName: {{ .Values.observability.secretName }}
            items:
              - key: OBSERVABILITY_TELEGRAM_BOT_TOKEN
                path: telegram-bot-token
        {{- if not .Values.observability.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.observability.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.observability.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.observability.storage.alertmanager }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: core-platform
  ports:
    - name: http
      port: 9093
      targetPort: http
{{- end }}
