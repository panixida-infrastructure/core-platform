{{- if and .Values.sonarqube.enabled .Values.sonarqube.branchPlugin.enabled .Values.sonarqube.prCleanup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-pr-cleanup
  namespace: {{ .Values.sonarqube.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: sonarqube-pr-cleanup
data:
  cleanup.py: |
{{ .Files.Get "files/sonarqube_pr_cleanup.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sonarqube-pr-cleanup
  namespace: {{ .Values.sonarqube.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: sonarqube-pr-cleanup
spec:
  schedule: {{ .Values.sonarqube.prCleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sonarqube-pr-cleanup
            app.kubernetes.io/part-of: core-platform
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: {{ .Values.sonarqube.prCleanup.image | quote }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              command: [python3, -B, /app/cleanup.py, --apply]
              env:
                - name: SONAR_URL
                  value: http://sonarqube.{{ .Values.sonarqube.namespace }}.svc.cluster.local:9000
                - name: GITHUB_API_URL
                  value: {{ .Values.sonarqube.githubIntegration.apiUrl | quote }}
                - name: GITHUB_INTEGRATION_KEY
                  value: {{ .Values.sonarqube.githubIntegration.key | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: code
                  mountPath: /app
                  readOnly: true
                - name: credentials
                  mountPath: /var/run/sonarqube-cleanup
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: sonarqube-pr-cleanup
            - name: credentials
              secret:
                secretName: {{ .Values.sonarqube.secretName }}
                defaultMode: 0440
                items:
                  - key: SONAR_ADMIN_PASSWORD
                    path: password
                  - key: SONAR_GITHUB_APP_ID
                    path: app-id
                  - key: SONAR_GITHUB_PRIVATE_KEY
                    path: private-key
{{- end }}
