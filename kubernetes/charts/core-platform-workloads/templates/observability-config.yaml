{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
data:
  config.yml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/victoria:
        client_auth:
          username: ${env:OBSERVABILITY_VM_REMOTE_WRITE_USERNAME}
          password: ${env:OBSERVABILITY_VM_REMOTE_WRITE_PASSWORD}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus/kubernetes:
        config:
          global:
            scrape_interval: 30s
            scrape_timeout: 10s
          scrape_configs:
            - job_name: kubernetes-nodes
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                - source_labels: [__meta_kubernetes_node_name]
                  regex: (.+)
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$$1/proxy/metrics
            - job_name: kubernetes-cadvisor
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                - source_labels: [__meta_kubernetes_node_name]
                  regex: (.+)
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$$1/proxy/metrics/cadvisor
            - job_name: linux-node-exporter
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: observability;node-exporter
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: keep
                  regex: Running
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "9100"
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: instance
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: kubernetes_node
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: kubernetes_pod_name
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: kubernetes_namespace
            {{- if .Values.observability.controlPlane.enabled }}
            - job_name: timeweb-kubernetes-node
              static_configs:
                {{- range .Values.observability.controlPlane.nodeExporterTargets }}
                - targets: [{{ .address | quote }}]
                  labels:
                    instance: {{ .instance | quote }}
                    provider: timeweb
                    node_role: control-plane
                {{- end }}
            - job_name: timeweb-kubernetes-apiserver
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              static_configs:
                - targets: [kubernetes.default.svc:443]
                  labels:
                    instance: core-platform-apiserver
                    provider: timeweb
                    node_role: control-plane
            {{- end }}
            - job_name: timeweb-dbaas-postgres
              scheme: https
              metrics_path: /${env:OBSERVABILITY_TIMEWEB_DBAAS_EXPORTER_ID}/service/metrics
              basic_auth:
                username: ${env:OBSERVABILITY_TIMEWEB_DBAAS_EXPORTER_USERNAME}
                password: ${env:OBSERVABILITY_TIMEWEB_DBAAS_EXPORTER_PASSWORD}
              static_configs:
                - targets:
                    - dbs-exporter.timeweb.cloud
                  labels:
                    db_cluster: postgres
                    db_system: postgresql
                    provider: timeweb
              relabel_configs:
                - target_label: instance
                  replacement: managed-postgres
            - job_name: timeweb-dbaas-node
              scheme: https
              metrics_path: /${env:OBSERVABILITY_TIMEWEB_DBAAS_EXPORTER_ID}/node-exporter/metrics
              basic_auth:
                username: ${env:OBSERVABILITY_TIMEWEB_DBAAS_EXPORTER_USERNAME}
                password: ${env:OBSERVABILITY_TIMEWEB_DBAAS_EXPORTER_PASSWORD}
              static_configs:
                - targets:
                    - dbs-exporter.timeweb.cloud
                  labels:
                    db_cluster: postgres
                    db_system: postgresql
                    provider: timeweb
              relabel_configs:
                - target_label: instance
                  replacement: managed-postgres
            - job_name: kubernetes-pods
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: kubernetes_namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: kubernetes_pod_name

      httpcheck/platform:
        collection_interval: 30s
        metrics:
          httpcheck.dns.lookup.duration:
            enabled: true
          httpcheck.client.connection.duration:
            enabled: true
          httpcheck.tls.handshake.duration:
            enabled: true
          httpcheck.client.request.duration:
            enabled: true
          httpcheck.response.duration:
            enabled: true
          httpcheck.tls.cert_remaining:
            enabled: true
          httpcheck.response.size:
            enabled: true
        targets:
          - method: GET
            disable_keep_alives: true
            endpoints:
              {{- range .Values.observability.httpCheckTargets }}
              - {{ . | quote }}
              {{- end }}

      httpcheck/telegram-vpn:
        collection_interval: 30s
        targets:
          - method: GET
            endpoint: https://api.telegram.org
            proxy_url: http://telegram-vpn.{{ .Values.observability.namespace }}.svc.cluster.local:8888
            disable_keep_alives: true

      httpcheck/telegram-egress:
        collection_interval: 30s
        targets:
          - method: GET
            endpoint: https://api.telegram.org
            proxy_url: http://telegram-egress.{{ .Values.observability.namespace }}.svc.cluster.local:8888
            disable_keep_alives: true

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/core-platform:
        attributes:
          - key: platform.name
            value: core-platform
            action: upsert
      resource/telegram-vpn:
        attributes:
          - key: service.name
            value: telegram-vpn-check
            action: upsert
          - key: telegram.route
            value: vpn
            action: upsert
      resource/telegram-egress:
        attributes:
          - key: service.name
            value: telegram-egress-check
            action: upsert
          - key: telegram.route
            value: vpn-or-direct
            action: upsert
      transform/logs:
        error_mode: ignore
        log_statements:
          - 'set(log.attributes["log.record.uid"], UUID()) where log.attributes["log.record.uid"] == nil or log.attributes["log.record.uid"] == ""'
          - 'set(log.attributes["http.request.method"], log.attributes["Method"]) where log.attributes["http.request.method"] == nil and log.attributes["Method"] != nil'
          - 'set(log.attributes["url.path"], log.attributes["RequestPath"]) where log.attributes["url.path"] == nil and log.attributes["RequestPath"] != nil'
          - 'set(log.attributes["url.path"], log.attributes["Path"]) where log.attributes["url.path"] == nil and log.attributes["Path"] != nil'
          - 'set(log.attributes["http.response.status_code"], log.attributes["StatusCode"]) where log.attributes["http.response.status_code"] == nil and log.attributes["StatusCode"] != nil'
          - 'set(log.attributes["http.server.request.duration_ms"], log.attributes["ElapsedMs"]) where log.attributes["http.server.request.duration_ms"] == nil and log.attributes["ElapsedMs"] != nil'
          - 'set(log.attributes["aspnetcore.endpoint.display_name"], log.attributes["Endpoint"]) where log.attributes["aspnetcore.endpoint.display_name"] == nil and log.attributes["Endpoint"] != nil'
          - 'set(log.attributes["client.address"], log.attributes["RemoteIp"]) where log.attributes["client.address"] == nil and log.attributes["RemoteIp"] != nil'
          - 'set(log.attributes["user_agent.original"], log.attributes["UserAgent"]) where log.attributes["user_agent.original"] == nil and log.attributes["UserAgent"] != nil'
          - 'set(log.attributes["network.protocol.name"], log.attributes["Transport"]) where log.attributes["network.protocol.name"] == nil and log.attributes["Transport"] != nil'
          - 'set(log.attributes["aspnetcore.connection.id"], log.attributes["ConnectionId"]) where log.attributes["aspnetcore.connection.id"] == nil and log.attributes["ConnectionId"] != nil'
          - 'set(log.attributes["aspnetcore.request.id"], log.attributes["RequestId"]) where log.attributes["aspnetcore.request.id"] == nil and log.attributes["RequestId"] != nil'
          - 'delete_key(log.attributes, "Method") where log.attributes["http.request.method"] != nil'
          - 'delete_key(log.attributes, "RequestPath") where log.attributes["url.path"] != nil'
          - 'delete_key(log.attributes, "Path") where log.attributes["url.path"] != nil'
          - 'delete_key(log.attributes, "StatusCode") where log.attributes["http.response.status_code"] != nil'
          - 'delete_key(log.attributes, "ElapsedMs") where log.attributes["http.server.request.duration_ms"] != nil'
          - 'delete_key(log.attributes, "Endpoint") where log.attributes["aspnetcore.endpoint.display_name"] != nil'
          - 'delete_key(log.attributes, "RemoteIp") where log.attributes["client.address"] != nil'
          - 'delete_key(log.attributes, "UserAgent") where log.attributes["user_agent.original"] != nil'
          - 'delete_key(log.attributes, "Transport") where log.attributes["network.protocol.name"] != nil'
          - 'delete_key(log.attributes, "ConnectionId") where log.attributes["aspnetcore.connection.id"] != nil'
          - 'delete_key(log.attributes, "RequestId") where log.attributes["aspnetcore.request.id"] != nil'
          - 'delete_key(log.attributes, "TraceId")'
          - 'delete_key(log.attributes, "SpanId")'
          - 'delete_key(log.attributes, "ParentId")'
      batch:
        timeout: 5s
        send_batch_size: 8192
        send_batch_max_size: 8192

    exporters:
      otlphttp/victoriametrics:
        compression: gzip
        sending_queue:
          num_consumers: 2
        metrics_endpoint: http://victoriametrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
        auth:
          authenticator: basicauth/victoria
      otlphttp/victorialogs:
        compression: gzip
        logs_endpoint: http://victorialogs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: service.name,deployment.environment,platform.name
        auth:
          authenticator: basicauth/victoria
      otlphttp/victoriatraces:
        compression: gzip
        traces_endpoint: http://victoriatraces.observability.svc.cluster.local:10428/insert/opentelemetry/v1/traces

    service:
      extensions: [health_check, basicauth/victoria]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        metrics:
          receivers: [otlp, prometheus/kubernetes, httpcheck/platform]
          processors: [memory_limiter, resource/core-platform, batch]
          exporters: [otlphttp/victoriametrics]
        metrics/telegram-vpn:
          receivers: [httpcheck/telegram-vpn]
          processors: [memory_limiter, resource/core-platform, resource/telegram-vpn, batch]
          exporters: [otlphttp/victoriametrics]
        metrics/telegram-egress:
          receivers: [httpcheck/telegram-egress]
          processors: [memory_limiter, resource/core-platform, resource/telegram-egress, batch]
          exporters: [otlphttp/victoriametrics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/core-platform, transform/logs, batch]
          exporters: [otlphttp/victorialogs]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/core-platform, batch]
          exporters: [otlphttp/victoriatraces]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-logs
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-logs
data:
  config.yml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/victoria:
        client_auth:
          username: ${env:OBSERVABILITY_VM_REMOTE_WRITE_USERNAME}
          password: ${env:OBSERVABILITY_VM_REMOTE_WRITE_PASSWORD}
      file_storage:
        directory: /var/lib/otelcol/storage
        create_directory: true

    receivers:
      filelog/kubernetes:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/observability_otel-logs-*/*/*.log
          - /var/log/pods/observability_telegram-alert-gateway-*/api/*.log
          - /var/log/pods/tactical-heroes-development_*/api/*.log
          - /var/log/pods/tactical-heroes-production_*/api/*.log
          - /var/log/pods/dotnet-template-development_*/api/*.log
          - /var/log/pods/dotnet-template-production_*/api/*.log
        start_at: end
        include_file_name: false
        include_file_path: true
        storage: file_storage
        operators:
          - id: container-parser
            type: container
          # Keep stack traces and indented console output with the event whose
          # prefix supplies their level. Other sources retain one record per line.
          - id: multiline-router
            type: router
            routes:
              - output: multiline-source
                expr: 'resource["k8s.container.name"] in ["sonarqube", "migrator", "squid", "log-forwarder"] or (resource["k8s.container.name"] == "admin" and resource["k8s.namespace.name"] matches "^tactical-heroes-admin-")'
            default: json-severity-parser
          - id: multiline-source
            type: add
            field: attributes["log.multiline.source"]
            value: EXPR(attributes["log.file.path"] + ":" + attributes["log.iostream"])
          - id: multiline-recombine
            type: recombine
            combine_field: body
            source_identifier: attributes["log.multiline.source"]
            is_first_entry: '(resource["k8s.container.name"] == "sonarqube" and body matches "^[0-9]{4}[.][0-9]{2}[.][0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}[[:space:]]") or (resource["k8s.container.name"] != "sonarqube" and body matches "^[^[:space:]]")'
            overwrite_with: oldest
            force_flush_period: 2s
            max_log_size: 262144
            max_unmatched_batch_size: 1
          - id: multiline-source-cleanup
            type: remove
            field: attributes["log.multiline.source"]
          - id: json-severity-parser
            type: json_parser
            if: 'body matches "^{.*level.*}$"'
            parse_to: attributes
            severity:
              parse_from: attributes.level
              overwrite_text: true
              mapping:
                warn: warning
                fatal: [critical, crit, panic, dpanic]
          - id: logfmt-severity-parser
            type: key_value_parser
            if: 'body matches "(^|[[:space:]])level="'
            parse_to: attributes
            severity:
              parse_from: attributes.level
              overwrite_text: true
              mapping:
                warn: warning
                fatal: [critical, crit, panic, dpanic]
          - id: klog-severity-parser
            type: regex_parser
            if: 'body matches "^[IWEF][0-9]{4}[[:space:]]"'
            regex: '^(?P<klog_level>[IWEF])[0-9]{4}[[:space:]]'
            parse_to: attributes
            severity:
              parse_from: attributes.klog_level
              preset: none
              overwrite_text: true
              mapping:
                info: I
                warn: W
                error: E
                fatal: F
          # Plain-text formats used by OpenBao, SonarQube, Gluetun, Kargo and OTel.
          # Anchor at the timestamp so severity words inside messages do not match.
          - id: timestamp-severity-parser
            type: regex_parser
            if: 'body matches "(?i)^([0-9]{4}[-.][0-9]{2}[-.][0-9]{2}[T ][0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?|[0-9]+[.][0-9]+(e[+-][0-9]+)?)[[:space:]]+[[]?(trace|debug|info|warn|warning|error|fatal|critical|panic|dpanic)[]]?[[:space:]]"'
            regex: '(?i)^([0-9]{4}[-.][0-9]{2}[-.][0-9]{2}[T ][0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?|[0-9]+[.][0-9]+(e[+-][0-9]+)?)[[:space:]]+[[]?(?P<parsed_level>trace|debug|info|warn|warning|error|fatal|critical|panic|dpanic)[]]?[[:space:]]'
            parse_to: attributes
            severity:
              parse_from: attributes.parsed_level
              overwrite_text: true
              mapping:
                warn: warning
                fatal: [critical, panic, dpanic]
          - id: dotnet-console-severity-parser
            type: regex_parser
            if: 'body matches "(?i)^(trce|dbug|info|warn|fail|crit|error):[[:space:]]"'
            regex: '(?i)^(?P<console_level>trce|dbug|info|warn|fail|crit|error):[[:space:]]'
            parse_to: attributes
            severity:
              parse_from: attributes.console_level
              overwrite_text: true
              mapping:
                trace: trce
                debug: dbug
                error: fail
                fatal: crit
          # Access logs do not carry an application severity. Classify their HTTP
          # result explicitly, and leave missing/non-HTTP statuses unspecified.
          - id: envoy-access-severity-parser
            type: regex_parser
            if: 'resource["k8s.container.name"] == "envoy" and body matches "^[{].*\"response_code\":[[:space:]]*[1-5][0-9]{2}[[:space:]]*[,}]" and not (body matches "\"level\"[[:space:]]*:")'
            regex: '^[{].*"response_code":[[:space:]]*(?P<response_code>[1-5][0-9]{2})[[:space:]]*[,}]'
            parse_to: attributes
            severity:
              parse_from: attributes.response_code
              preset: none
              overwrite_text: true
              mapping:
                info: [{min: 100, max: 399}]
                warn: 4xx
                error: 5xx
          - id: squid-access-severity-parser
            type: regex_parser
            if: 'resource["k8s.container.name"] in ["squid", "log-forwarder"] and body matches "^[0-9]+[.][0-9]+[[:space:]]+[0-9]+[[:space:]]+[^[:space:]]+[[:space:]]+[A-Z_]+/[1-5][0-9]{2}[[:space:]]"'
            regex: '^[0-9]+[.][0-9]+[[:space:]]+[0-9]+[[:space:]]+[^[:space:]]+[[:space:]]+[A-Z_]+/(?P<response_code>[1-5][0-9]{2})[[:space:]]'
            parse_to: attributes
            severity:
              parse_from: attributes.response_code
              preset: none
              overwrite_text: true
              mapping:
                info: [{min: 100, max: 399}]
                warn: 4xx
                error: 5xx
          # Squid cache.log has a different format from its access log. Match
          # explicit diagnostic prefixes and known maintenance messages only.
          - id: squid-cache-severity-parser
            type: regex_parser
            if: 'resource["k8s.container.name"] in ["squid", "log-forwarder"] and body matches "^[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}( [A-Za-z0-9_-]+)?[|][[:space:]]+(WARNING:|FATAL:|ERROR:|Open  icmp_sock:|Recv recv:|Logfile: opening log |Logfile: closing log |NETDB state saved;|Set Current Directory to |Processing Configuration File: |Created PID file |Removing PID file |Creating missing swap directories|No cache_dir stores are configured[.]|Starting Squid Cache version |Service Name: |Process ID |Process Roles: |With |Using |Initializing IP Cache|Adding nameserver |Adding domain |Adding ndots |DNS IPv4 socket created |DNS IPv6 socket created |Local cache digest enabled;|Finished loading MIME types and icons[.]|HTCP Disabled[.]|Adaptation support is off[.]|Squid plugin modules loaded: |Accepting HTTP Socket connections at |Store logging disabled|Swap maxSize |Target number of buckets: |Max Swap size: |Max Mem  size: |Pinger socket opened |Closing Pinger socket |Initialising ICMP pinger |Configuring Parent |storeLateRelease: released )"'
            regex: '^[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}( [A-Za-z0-9_-]+)?[|][[:space:]]+(?P<cache_level>WARNING:|FATAL:|ERROR:|Open  icmp_sock:|Recv recv:|Logfile: opening log |Logfile: closing log |NETDB state saved;|Set Current Directory to |Processing Configuration File: |Created PID file |Removing PID file |Creating missing swap directories|No cache_dir stores are configured[.]|Starting Squid Cache version |Service Name: |Process ID |Process Roles: |With |Using |Initializing IP Cache|Adding nameserver |Adding domain |Adding ndots |DNS IPv4 socket created |DNS IPv6 socket created |Local cache digest enabled;|Finished loading MIME types and icons[.]|HTCP Disabled[.]|Adaptation support is off[.]|Squid plugin modules loaded: |Accepting HTTP Socket connections at |Store logging disabled|Swap maxSize |Target number of buckets: |Max Swap size: |Max Mem  size: |Pinger socket opened |Closing Pinger socket |Initialising ICMP pinger |Configuring Parent |storeLateRelease: released )'
            parse_to: attributes
            severity:
              parse_from: attributes.cache_level
              preset: none
              overwrite_text: true
              mapping:
                info:
                  - "Logfile: opening log "
                  - "Logfile: closing log "
                  - "NETDB state saved;"
                  - "Set Current Directory to "
                  - "Processing Configuration File: "
                  - "Created PID file "
                  - "Removing PID file "
                  - "Creating missing swap directories"
                  - "No cache_dir stores are configured."
                  - "Starting Squid Cache version "
                  - "Service Name: "
                  - "Process ID "
                  - "Process Roles: "
                  - "With "
                  - "Using "
                  - "Initializing IP Cache"
                  - "Adding nameserver "
                  - "Adding domain "
                  - "Adding ndots "
                  - "DNS IPv4 socket created "
                  - "DNS IPv6 socket created "
                  - "Local cache digest enabled;"
                  - "Finished loading MIME types and icons."
                  - "HTCP Disabled."
                  - "Adaptation support is off."
                  - "Squid plugin modules loaded: "
                  - "Accepting HTTP Socket connections at "
                  - "Store logging disabled"
                  - "Swap maxSize "
                  - "Target number of buckets: "
                  - "Max Swap size: "
                  - "Max Mem  size: "
                  - "Pinger socket opened "
                  - "Closing Pinger socket "
                  - "Initialising ICMP pinger "
                  - "Configuring Parent "
                  - "storeLateRelease: released "
                warn: "WARNING:"
                error: ["ERROR:", "Open  icmp_sock:", "Recv recv:"]
                fatal: "FATAL:"
          - id: keycloak-cli-severity-parser
            type: regex_parser
            if: 'resource["k8s.container.name"] == "keycloak-sso-configure" and body matches "^(Logging into https?://|Created new (client|model) with id )"'
            regex: '^(?P<cli_level>Logging into https?://|Created new (client|model) with id )'
            parse_to: attributes
            severity:
              parse_from: attributes.cli_level
              preset: none
              overwrite_text: true
              mapping:
                info: ["Logging into http://", "Logging into https://", "Created new client with id ", "Created new model with id "]
          - id: envoy-no-route-severity-parser
            type: regex_parser
            if: 'resource["k8s.container.name"] == "envoy" and body matches "^[{].*\"response_code\":[[:space:]]*0[[:space:]]*[,}]" and body matches "\"response_code_details\":[[:space:]]*\"filter_chain_not_found\"" and not (body matches "\"level\"[[:space:]]*:")'
            regex: '"response_code_details":[[:space:]]*"(?P<response_failure>filter_chain_not_found)"'
            parse_to: attributes
            severity:
              parse_from: attributes.response_failure
              preset: none
              overwrite_text: true
              mapping:
                warn: filter_chain_not_found
          - id: native-loader-severity-parser
            type: regex_parser
            if: 'resource["k8s.container.name"] == "migrator" and body matches "^Cannot load library [^[:space:]]+"'
            regex: '^(?P<loader_level>Cannot load library) '
            parse_to: attributes
            severity:
              parse_from: attributes.loader_level
              preset: none
              overwrite_text: true
              mapping:
                error: Cannot load library

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
      transform/kubernetes:
        error_mode: ignore
        log_statements:
          - 'set(log.attributes["log.record.uid"], UUID()) where log.attributes["log.record.uid"] == nil or log.attributes["log.record.uid"] == ""'
          - 'replace_pattern(log.body, "bot[0-9]{8,}:[A-Za-z0-9_-]{20,}", "bot[REDACTED]") where IsString(log.body)'
          - 'set(resource.attributes["service.name"], resource.attributes["k8s.container.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.container.name"] != nil'
          - 'set(resource.attributes["deployment.environment"], resource.attributes["k8s.namespace.name"]) where resource.attributes["deployment.environment"] == nil and resource.attributes["k8s.namespace.name"] != nil'
          - 'set(resource.attributes["platform.name"], "core-platform")'
      batch:
        timeout: 5s
        send_batch_size: 8192

    exporters:
      otlphttp/victorialogs:
        compression: gzip
        logs_endpoint: http://victorialogs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: service.name,deployment.environment,platform.name
        auth:
          authenticator: basicauth/victoria

    service:
      extensions: [health_check, basicauth/victoria, file_storage]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        logs:
          receivers: [filelog/kubernetes]
          processors: [memory_limiter, k8sattributes, transform/kubernetes, batch]
          exporters: [otlphttp/victorialogs]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegram-egress
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-egress
data:
  squid.conf: |
    http_port 8888

    acl CONNECT method CONNECT
    acl SSL_ports port 443
    acl telegram_domains dstdomain .telegram.org
    acl direct_route req_header X-Panixida-Telegram-Route -i direct

    http_access deny !CONNECT
    http_access deny CONNECT !SSL_ports
    http_access deny !telegram_domains
    http_access allow telegram_domains
    http_access deny all

    # Prefer the VPN parent for every normal request. Squid still falls back to
    # the direct destination when the parent connection fails.
    cache_peer telegram-vpn.{{ .Values.observability.namespace }}.svc.cluster.local parent 8888 0 no-query round-robin name=vpn connect-timeout=3 connect-fail-limit=3
    cache_peer_access vpn deny direct_route
    cache_peer_access vpn allow telegram_domains
    cache_peer_access vpn deny all

    always_direct allow direct_route
    nonhierarchical_direct off
    prefer_direct off
    minimum_direct_rtt 0
    minimum_direct_hops 0
    connect_timeout 5 seconds
    forward_timeout 15 seconds
    request_timeout 30 seconds
    shutdown_lifetime 1 second
    cache deny all
    cache_mem 16 MB
    pinger_enable off
    netdb_filename none
    cache_log /var/log/squid/cache.log
    logformat telegram_egress %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru route=%{X-Panixida-Telegram-Route}>h %Sh/%<a %mt
    access_log stdio:/var/log/squid/access.log telegram_egress
    cache_store_log none
    pid_filename /tmp/squid.pid
    coredump_dir /tmp
    visible_hostname telegram-egress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: vmalert
data:
  rules.yml: |
    groups:
      - name: kubernetes-basic
        rules:
          - alert: KubernetesNodeDown
            expr: up{service_name="kubernetes-nodes"} == 0
            for: 5m
            labels:
              severity: warning
              alert_owner: core-platform
              environment: production
            annotations:
              summary: Kubernetes node metrics are unavailable.
              description: Kubelet node metrics have been unavailable for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview" "panel" 8) | quote }}
          - alert: KubernetesCadvisorDown
            expr: up{service_name="kubernetes-cadvisor"} == 0
            for: 5m
            labels:
              severity: warning
              alert_owner: core-platform
              environment: production
            annotations:
              summary: Kubernetes cAdvisor metrics are unavailable.
              description: Kubelet cAdvisor container metrics have been unavailable for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "kubernetes-workloads" "variables" (dict "node" "kubernetes_io_hostname")) | quote }}
          - alert: KubernetesLogCollectionDown
            expr: count(up{service_name="kubernetes-nodes"} == 1) > count(up{app_kubernetes_io_name="otel-logs"} == 1) or absent(up{app_kubernetes_io_name="otel-logs"})
            for: 5m
            labels:
              severity: critical
              alert_owner: observability
              environment: production
            annotations:
              summary: Kubernetes log collection is incomplete.
              description: At least one Kubernetes node has no healthy OpenTelemetry filelog collector, so its container logs may be missing from VictoriaLogs.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview") | quote }}
              logs_url: https://grafana.panixida.ru/explore?left=%7B%22datasource%22:%22victorialogs%22%7D
          - alert: KubernetesLogExportFailures
            expr: increase(otelcol_exporter_send_failed_log_records_total{app_kubernetes_io_name="otel-logs"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
              alert_owner: observability
              environment: production
            annotations:
              summary: Kubernetes logs cannot be exported to VictoriaLogs.
              description: A node log collector failed to export one or more log records during the last 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview" "panel" 6) | quote }}
              logs_url: https://grafana.panixida.ru/explore?left=%7B%22datasource%22:%22victorialogs%22%7D
          - alert: LinuxNodeExporterDown
            expr: up{service_name="linux-node-exporter"} == 0
            for: 5m
            labels:
              severity: warning
              alert_owner: core-platform
              environment: production
            annotations:
              summary: Linux node exporter metrics are unavailable.
              description: Host OS metrics from node-exporter have been unavailable for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "infrastructure-nodes" "variables" (dict "node" "service_instance_id")) | quote }}
          {{- if .Values.observability.controlPlane.enabled }}
          - alert: ControlPlaneNodeExporterDown
            expr: up{service_name="timeweb-kubernetes-node"} == 0 or absent(up{service_name="timeweb-kubernetes-node"})
            for: 5m
            labels:
              severity: warning
              alert_owner: core-platform
              environment: production
            annotations:
              summary: Managed control-plane host metrics are unavailable.
              description: The Timeweb master node exporter has been unavailable for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "kubernetes-control-plane") | quote }}
          - alert: ControlPlaneApiServerDown
            expr: up{service_name="timeweb-kubernetes-apiserver"} == 0 or absent(up{service_name="timeweb-kubernetes-apiserver"})
            for: 2m
            labels:
              severity: critical
              alert_owner: core-platform
              environment: production
            annotations:
              summary: Managed Kubernetes API server is unavailable.
              description: API server metrics have been unreachable for at least 2 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "kubernetes-control-plane" "panel" 1) | quote }}
          - alert: ControlPlaneOomKill
            expr: increase(node_vmstat_oom_kill{service_name="timeweb-kubernetes-node"}[10m]) > 0
            labels:
              severity: critical
              alert_owner: core-platform
              environment: production
            annotations:
              summary: A process was killed by OOM on the managed master node.
              description: The host OOM counter increased during the last 10 minutes. Check memory and API server restarts; the separate restart alert is suppressed during this OOM window.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "kubernetes-control-plane" "panel" 13) | quote }}
          - alert: ControlPlaneApiServerRestarted
            expr: (changes(process_start_time_seconds{service_name="timeweb-kubernetes-apiserver"}[10m]) > 0) unless on() (increase(node_vmstat_oom_kill{service_name="timeweb-kubernetes-node"}[10m]) > 0)
            labels:
              severity: warning
              alert_owner: core-platform
              environment: production
            annotations:
              summary: The managed API server process restarted.
              description: API process start time changed during the last 10 minutes without a recorded host OOM increase. Check the provider logs.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "kubernetes-control-plane" "panel" 13) | quote }}
          {{- if .Values.observability.controlPlane.logs.enabled }}
          - alert: ControlPlaneDiagnosticStreamResetBurst
            expr: sum(increase(timeweb_control_plane_logs_diagnostic_stream_resets_total[5m])) >= 10
            for: 2m
            labels:
              severity: warning
              alert_owner: core-platform
              environment: production
            annotations:
              summary: Frequent client stream resets from a known diagnostic peer.
              description: At least 10 diagnostic client stream resets were collected in 5 minutes. Check operator connections, VPN stability and API health; individual source errors remain in the logs as Warning.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "kubernetes-control-plane" "panel" 6) | quote }}
          - alert: ControlPlaneLogCollectionStalled
            expr: time() - max(timeweb_control_plane_logs_last_success_timestamp_seconds) > 300 or absent(timeweb_control_plane_logs_last_success_timestamp_seconds)
            for: 5m
            labels:
              severity: warning
              alert_owner: core-platform
              environment: production
            annotations:
              summary: Managed control-plane logs are not being collected.
              description: No successful Timeweb API log polling cycle has completed for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "kubernetes-control-plane" "panel" 6) | quote }}
          {{- end }}
          {{- end }}
          - alert: PlatformEndpointDown
            expr: max by (http_url) (httpcheck_status_ratio{http_status_class="2xx",http_url!="http://telegram-alert-gateway.observability.svc.cluster.local/health/ready"}) == 0
            for: 5m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^https://(dev[.])?api[.]dotnet-template[.]panixida[.]ru/health$" $labels.http_url {{ "}}" }}dotnet-template{{ "{{" }} else if match "^https://(dev[.])?(api[.])?tactical-heroes[.]panixida[.]ru/health$" $labels.http_url {{ "}}" }}tactical-heroes{{ "{{" }} else {{ "}}" }}core-platform{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "^https://dev[.]" $labels.http_url {{ "}}" }}development{{ "{{" }} else {{ "}}" }}production{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: Platform endpoint is not reachable.
              description: One public platform endpoint has failed OpenTelemetry HTTP checks for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview" "panel" 1) | quote }}
          - alert: PlatformEndpointSlow
            expr: max by (http_url) (httpcheck_duration_milliseconds{http_url!="http://telegram-alert-gateway.observability.svc.cluster.local/health/ready"}) > 2000
            for: 3m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^https://(dev[.])?api[.]dotnet-template[.]panixida[.]ru/health$" $labels.http_url {{ "}}" }}dotnet-template{{ "{{" }} else if match "^https://(dev[.])?(api[.])?tactical-heroes[.]panixida[.]ru/health$" $labels.http_url {{ "}}" }}tactical-heroes{{ "{{" }} else {{ "}}" }}core-platform{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "^https://dev[.]" $labels.http_url {{ "}}" }}development{{ "{{" }} else {{ "}}" }}production{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: Platform endpoint is slow.
              description: One public platform endpoint has responded slower than 2 seconds for at least 3 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview" "panel" 7) | quote }}
          - alert: SslCertificateExpiringSoon
            expr: min by (http_url) (httpcheck_tls_cert_remaining_seconds) < 1209600
            for: 30m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^https://(dev[.])?api[.]dotnet-template[.]panixida[.]ru/health$" $labels.http_url {{ "}}" }}dotnet-template{{ "{{" }} else if match "^https://(dev[.])?(api[.])?tactical-heroes[.]panixida[.]ru/health$" $labels.http_url {{ "}}" }}tactical-heroes{{ "{{" }} else {{ "}}" }}core-platform{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "^https://dev[.]" $labels.http_url {{ "}}" }}development{{ "{{" }} else {{ "}}" }}production{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: TLS certificate expires soon.
              description: A public endpoint TLS certificate has less than 14 days remaining.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview" "panel" 2) | quote }}
          - alert: TelegramVpnProxyDown
            expr: time() - max(timestamp(httpcheck_status_ratio{service_name="telegram-vpn-check",http_status_class="2xx",http_status_code=~"2.."})) > 60 or absent(httpcheck_status_ratio{service_name="telegram-vpn-check",http_status_class="2xx",http_status_code=~"2.."})
            for: 2m
            labels:
              severity: warning
              alert_owner: observability
              environment: production
            annotations:
              summary: Telegram VPN proxy is unavailable.
              description: Telegram is not reachable through the preferred WireGuard route; the direct fallback remains active.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview") | quote }}
              logs_url: https://grafana.panixida.ru/explore?left=%7B%22datasource%22:%22victorialogs%22%7D
          - alert: TelegramAlertGatewayDown
            expr: max(httpcheck_status_ratio{http_url="http://telegram-alert-gateway.observability.svc.cluster.local/health/ready",http_status_class="2xx"}) == 0 or absent(httpcheck_status_ratio{http_url="http://telegram-alert-gateway.observability.svc.cluster.local/health/ready",http_status_class="2xx"})
            for: 2m
            labels:
              severity: critical
              alert_owner: observability
              environment: production
            annotations:
              summary: Telegram alert gateway is unavailable.
              description: The gateway readiness endpoint or its PostgreSQL dependency has been unavailable for at least two minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview" "panel" 1) | quote }}
          - alert: TelegramAlertGatewayDeliveryFailures
            expr: increase(telegram_alert_gateway_notifications_failed_total[5m]) > 0
            for: 1m
            labels:
              severity: critical
              alert_owner: observability
              environment: production
            annotations:
              summary: Telegram alert gateway cannot deliver notifications.
              description: At least one Telegram delivery attempt failed during the last five minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview") | quote }}
          - alert: AlertmanagerGatewayDeliveryFailures
            expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
              alert_owner: observability
              environment: production
            annotations:
              summary: Alertmanager cannot reach the Telegram alert gateway.
              description: At least one Alertmanager webhook delivery failed during the last five minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview") | quote }}
          - alert: TelegramEgressDown
            expr: time() - max(timestamp(httpcheck_status_ratio{service_name="telegram-egress-check",http_status_class="2xx",http_status_code=~"2.."})) > 60 or absent(httpcheck_status_ratio{service_name="telegram-egress-check",http_status_class="2xx",http_status_code=~"2.."})
            for: 2m
            labels:
              severity: critical
              alert_owner: observability
              environment: production
            annotations:
              summary: Telegram alert delivery route is unavailable.
              description: Telegram is not reachable through either the WireGuard route or the direct fallback.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview") | quote }}
              logs_url: https://grafana.panixida.ru/explore?left=%7B%22datasource%22:%22victorialogs%22%7D
          - alert: TelegramNotificationFailures
            expr: increase(alertmanager_notifications_failed_total{integration="telegram"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
              alert_owner: observability
              environment: production
            annotations:
              summary: Alertmanager failed to send a Telegram notification.
              description: At least one Telegram delivery attempt has failed during the last 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "core-platform-overview") | quote }}
              logs_url: https://grafana.panixida.ru/explore?left=%7B%22datasource%22:%22victorialogs%22%7D
          - alert: TimewebPostgresExporterDown
            expr: up{service_name="timeweb-dbaas-postgres"} == 0
            for: 5m
            labels:
              severity: warning
              alert_owner: postgresql
              environment: production
            annotations:
              summary: Timeweb PostgreSQL exporter is unavailable.
              description: Managed PostgreSQL DB exporter metrics have been unavailable for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "postgresql-managed") | quote }}
          - alert: TimewebPostgresHostExporterDown
            expr: up{service_name="timeweb-dbaas-node"} == 0
            for: 5m
            labels:
              severity: warning
              alert_owner: postgresql
              environment: production
            annotations:
              summary: Timeweb PostgreSQL host exporter is unavailable.
              description: Managed PostgreSQL host node exporter metrics have been unavailable for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "postgresql-managed") | quote }}
          - alert: TimewebPostgresScrapeError
            expr: pg_exporter_last_scrape_error{service_name="timeweb-dbaas-postgres"} > 0
            for: 5m
            labels:
              severity: warning
              alert_owner: postgresql
              environment: production
            annotations:
              summary: Managed PostgreSQL exporter scrape is failing.
              description: The PostgreSQL exporter reports scrape errors for the managed database.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "postgresql-managed" "panel" 2) | quote }}
          - alert: TimewebPostgresDown
            expr: pg_up{service_name="timeweb-dbaas-postgres"} == 0
            for: 5m
            labels:
              severity: critical
              alert_owner: postgresql
              environment: production
            annotations:
              summary: Managed PostgreSQL is not reachable by exporter.
              description: The PostgreSQL exporter cannot reach the managed PostgreSQL instance.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "postgresql-managed" "panel" 1) | quote }}
          - alert: TimewebPostgresHighConnectionUsage
            expr: 100 * sum(pg_stat_activity_count{service_name="timeweb-dbaas-postgres"}) / max(pg_settings_max_connections{service_name="timeweb-dbaas-postgres"}) > 80
            for: 10m
            labels:
              severity: warning
              alert_owner: postgresql
              environment: production
            annotations:
              summary: Managed PostgreSQL connection usage is high.
              description: PostgreSQL connection usage has stayed above 80 percent for at least 10 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "postgresql-managed" "panel" 3) | quote }}
          - alert: HostHighCpu
            expr: 100 * (1 - avg by (service_name, service_instance_id, k8s_node_name) (rate(node_cpu_seconds_total{service_name=~"linux-node-exporter|timeweb-dbaas-node|timeweb-kubernetes-node",mode="idle"}[5m]))) > 85
            for: 10m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^timeweb-dbaas-" $labels.service_name {{ "}}" }}postgresql{{ "{{" }} else {{ "}}" }}core-platform{{ "{{" }} end {{ "}}" }}'
              environment: production
            annotations:
              summary: Host CPU usage is high.
              description: Host CPU usage has stayed above 85 percent for at least 10 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "infrastructure-nodes" "panel" 1 "variables" (dict "node" "service_instance_id")) | quote }}
          - alert: HostHighMemory
            expr: 100 * (1 - (sum by (service_name, service_instance_id, k8s_node_name) (node_memory_MemAvailable_bytes{service_name=~"linux-node-exporter|timeweb-dbaas-node|timeweb-kubernetes-node"}) / sum by (service_name, service_instance_id, k8s_node_name) (node_memory_MemTotal_bytes{service_name=~"linux-node-exporter|timeweb-dbaas-node|timeweb-kubernetes-node"}))) > 90
            for: 10m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^timeweb-dbaas-" $labels.service_name {{ "}}" }}postgresql{{ "{{" }} else {{ "}}" }}core-platform{{ "{{" }} end {{ "}}" }}'
              environment: production
            annotations:
              summary: Host memory usage is high.
              description: Host memory usage has stayed above 90 percent for at least 10 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "infrastructure-nodes" "panel" 2 "variables" (dict "node" "service_instance_id")) | quote }}
          - alert: HostFilesystemHighUsage
            expr: 100 * (1 - (sum by (service_name, service_instance_id, k8s_node_name, mountpoint) (node_filesystem_avail_bytes{service_name=~"linux-node-exporter|timeweb-dbaas-node|timeweb-kubernetes-node",fstype!~"tmpfs|overlay|squashfs|fuse.*",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"}) / sum by (service_name, service_instance_id, k8s_node_name, mountpoint) (node_filesystem_size_bytes{service_name=~"linux-node-exporter|timeweb-dbaas-node|timeweb-kubernetes-node",fstype!~"tmpfs|overlay|squashfs|fuse.*",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"}))) > 85
            for: 10m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^timeweb-dbaas-" $labels.service_name {{ "}}" }}postgresql{{ "{{" }} else {{ "}}" }}core-platform{{ "{{" }} end {{ "}}" }}'
              environment: production
            annotations:
              summary: Host filesystem usage is high.
              description: Host filesystem usage has stayed above 85 percent for at least 10 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "infrastructure-nodes" "panel" 13 "variables" (dict "node" "service_instance_id")) | quote }}
          - alert: ApplicationSlowHttpRequests
            expr: histogram_quantile(0.95, sum by (le, service_name, http_route) (rate(http_server_request_duration_seconds_bucket{http_route!=""}[5m]))) > 2
            for: 5m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^dotnet-template-" $labels.service_name {{ "}}" }}dotnet-template{{ "{{" }} else if match "^tactical-heroes-" $labels.service_name {{ "}}" }}tactical-heroes{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}observability{{ "{{" }} else {{ "}}" }}unclassified{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "-development$" $labels.service_name {{ "}}" }}development{{ "{{" }} else if match "-production$" $labels.service_name {{ "}}" }}production{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}production{{ "{{" }} else {{ "}}" }}unknown{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: Application HTTP route is slow.
              description: Application route p95 latency has stayed above 2 seconds for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "application-telemetry" "panel" 15 "variables" (dict "service" "service_name")) | quote }}
          - alert: ApplicationHigh5xxErrorRate
            expr: (sum by (service_name, http_route) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..",http_route!=""}[5m])) / sum by (service_name, http_route) (rate(http_server_request_duration_seconds_count{http_route!=""}[5m]))) > 0.05
            for: 1m
            labels:
              severity: critical
              alert_owner: '{{ "{{" }} if match "^dotnet-template-" $labels.service_name {{ "}}" }}dotnet-template{{ "{{" }} else if match "^tactical-heroes-" $labels.service_name {{ "}}" }}tactical-heroes{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}observability{{ "{{" }} else {{ "}}" }}unclassified{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "-development$" $labels.service_name {{ "}}" }}development{{ "{{" }} else if match "-production$" $labels.service_name {{ "}}" }}production{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}production{{ "{{" }} else {{ "}}" }}unknown{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: Application 5xx error rate is high.
              description: Application route 5xx error ratio has stayed above 5 percent for at least 1 minute.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "application-telemetry" "panel" 23 "variables" (dict "service" "service_name")) | quote }}
          - alert: ApplicationHighGcPause
            expr: sum by (service_name) (rate(dotnet_gc_pause_time_seconds_total[5m])) > 0.10
            for: 5m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^dotnet-template-" $labels.service_name {{ "}}" }}dotnet-template{{ "{{" }} else if match "^tactical-heroes-" $labels.service_name {{ "}}" }}tactical-heroes{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}observability{{ "{{" }} else {{ "}}" }}unclassified{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "-development$" $labels.service_name {{ "}}" }}development{{ "{{" }} else if match "-production$" $labels.service_name {{ "}}" }}production{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}production{{ "{{" }} else {{ "}}" }}unknown{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: Application GC pause ratio is high.
              description: .NET GC pause time has stayed above 10 percent of wall time for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "application-telemetry" "panel" 30 "variables" (dict "service" "service_name")) | quote }}
          - alert: ApplicationHighCpu
            expr: 100 * sum by (service_name, service_instance_id) (rate(dotnet_process_cpu_time_seconds_total[5m])) / max by (service_name, service_instance_id) (dotnet_process_cpu_count) > 80
            for: 10m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^dotnet-template-" $labels.service_name {{ "}}" }}dotnet-template{{ "{{" }} else if match "^tactical-heroes-" $labels.service_name {{ "}}" }}tactical-heroes{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}observability{{ "{{" }} else {{ "}}" }}unclassified{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "-development$" $labels.service_name {{ "}}" }}development{{ "{{" }} else if match "-production$" $labels.service_name {{ "}}" }}production{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}production{{ "{{" }} else {{ "}}" }}unknown{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: Application CPU usage is high.
              description: Application process CPU usage has stayed above 80 percent for at least 10 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "application-telemetry" "panel" 25 "variables" (dict "service" "service_name")) | quote }}
          - alert: ApplicationHighMemoryUsage
            expr: 100 * (sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~".*-(development|production)",container!="",container!="POD",pod!=""}) / sum by (namespace, pod, container) (container_spec_memory_limit_bytes{namespace=~".*-(development|production)",container!="",container!="POD",pod!=""} > 0)) > 85
            for: 10m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^dotnet-template-" $labels.namespace {{ "}}" }}dotnet-template{{ "{{" }} else if match "^tactical-heroes-" $labels.namespace {{ "}}" }}tactical-heroes{{ "{{" }} else {{ "}}" }}unclassified{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "-development$" $labels.namespace {{ "}}" }}development{{ "{{" }} else if match "-production$" $labels.namespace {{ "}}" }}production{{ "{{" }} else {{ "}}" }}unknown{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: Application container memory usage is high.
              description: Application container memory usage has stayed above 85 percent of its Kubernetes limit for at least 10 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "kubernetes-workloads" "panel" 2 "variables" (dict "namespace" "namespace" "pod" "pod" "container" "container")) | quote }}
          - alert: ApplicationHighExceptionRate
            expr: sum by (service_name) (rate(dotnet_exceptions_total[5m])) > 1
            for: 5m
            labels:
              severity: warning
              alert_owner: '{{ "{{" }} if match "^dotnet-template-" $labels.service_name {{ "}}" }}dotnet-template{{ "{{" }} else if match "^tactical-heroes-" $labels.service_name {{ "}}" }}tactical-heroes{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}observability{{ "{{" }} else {{ "}}" }}unclassified{{ "{{" }} end {{ "}}" }}'
              environment: '{{ "{{" }} if match "-development$" $labels.service_name {{ "}}" }}development{{ "{{" }} else if match "-production$" $labels.service_name {{ "}}" }}production{{ "{{" }} else if match "^telegram-alert-gateway$" $labels.service_name {{ "}}" }}production{{ "{{" }} else {{ "}}" }}unknown{{ "{{" }} end {{ "}}" }}'
            annotations:
              summary: Application exception rate is high.
              description: .NET exception rate has stayed above 1 exception per second for at least 5 minutes.
              dashboard_url: {{ include "core-platform-workloads.metricDashboardUrl" (dict "root" . "dashboard" "application-telemetry" "panel" 45 "variables" (dict "service" "service_name")) | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: alertmanager
data:
  alertmanager.yml: |
    templates:
      - /etc/alertmanager/telegram.tmpl
    route:
      receiver: gateway-unclassified
      group_by: ["alert_owner", "environment"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: telegram-gateway-emergency
          matchers:
            - alertname=~"TelegramAlertGatewayDown|TelegramAlertGatewayDeliveryFailures|AlertmanagerGatewayDeliveryFailures"
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 30m
        - receiver: telegram-vpn-smoke
          matchers:
            - telegram_route_test="vpn"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1h
        - receiver: telegram-direct-smoke
          matchers:
            - telegram_route_test="direct"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1h
        - receiver: gateway-tactical-heroes
          matchers:
            - alert_owner="tactical-heroes"
        - receiver: gateway-dotnet-template
          matchers:
            - alert_owner="dotnet-template"
        - receiver: gateway-postgresql
          matchers:
            - alert_owner="postgresql"
        - receiver: gateway-core-platform
          matchers:
            - alert_owner="core-platform"
        - receiver: gateway-observability
          matchers:
            - alert_owner="observability"
        - receiver: gateway-tests
          matchers:
            - alert_owner="tests"
    receivers:
      - name: telegram-gateway-emergency
        telegram_configs:
          - chat_id: {{ .Values.observability.alerts.telegram.chatId }}
            message_thread_id: {{ index .Values.observability.alerts.telegram.topics "observability" }}
            bot_token_file: /etc/alertmanager-secrets/telegram-bot-token
            http_config:
              proxy_url: http://telegram-egress.{{ .Values.observability.namespace }}.svc.cluster.local:8888
            send_resolved: true
            parse_mode: HTML
            message: '{{ "{{" }} template "telegram.panixida.message" . {{ "}}" }}'
      - name: gateway-tactical-heroes
        webhook_configs:
          - url: http://telegram-alert-gateway.{{ .Values.observability.namespace }}.svc.cluster.local/api/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager-gateway-secrets/webhook-token
      - name: gateway-dotnet-template
        webhook_configs:
          - url: http://telegram-alert-gateway.{{ .Values.observability.namespace }}.svc.cluster.local/api/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager-gateway-secrets/webhook-token
      - name: gateway-postgresql
        webhook_configs:
          - url: http://telegram-alert-gateway.{{ .Values.observability.namespace }}.svc.cluster.local/api/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager-gateway-secrets/webhook-token
      - name: gateway-core-platform
        webhook_configs:
          - url: http://telegram-alert-gateway.{{ .Values.observability.namespace }}.svc.cluster.local/api/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager-gateway-secrets/webhook-token
      - name: gateway-observability
        webhook_configs:
          - url: http://telegram-alert-gateway.{{ .Values.observability.namespace }}.svc.cluster.local/api/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager-gateway-secrets/webhook-token
      - name: gateway-unclassified
        webhook_configs:
          - url: http://telegram-alert-gateway.{{ .Values.observability.namespace }}.svc.cluster.local/api/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager-gateway-secrets/webhook-token
      - name: gateway-tests
        webhook_configs:
          - url: http://telegram-alert-gateway.{{ .Values.observability.namespace }}.svc.cluster.local/api/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager-gateway-secrets/webhook-token
      - name: telegram-vpn-smoke
        telegram_configs:
          - chat_id: {{ .Values.observability.alerts.telegram.chatId }}
            message_thread_id: {{ index .Values.observability.alerts.telegram.topics "tests" }}
            bot_token_file: /etc/alertmanager-secrets/telegram-bot-token
            http_config:
              proxy_url: http://telegram-egress.{{ .Values.observability.namespace }}.svc.cluster.local:8888
            send_resolved: false
            disable_notifications: true
            parse_mode: HTML
            message: '{{ "{{" }} template "telegram.panixida.message" . {{ "}}" }}'
      - name: telegram-direct-smoke
        telegram_configs:
          - chat_id: {{ .Values.observability.alerts.telegram.chatId }}
            message_thread_id: {{ index .Values.observability.alerts.telegram.topics "tests" }}
            bot_token_file: /etc/alertmanager-secrets/telegram-bot-token
            http_config:
              proxy_url: http://telegram-egress.{{ .Values.observability.namespace }}.svc.cluster.local:8888
              proxy_connect_header:
                X-Panixida-Telegram-Route:
                  - direct
            send_resolved: false
            disable_notifications: true
            parse_mode: HTML
            message: '{{ "{{" }} template "telegram.panixida.message" . {{ "}}" }}'
  # Keep complete HTML blocks below Alertmanager's own 4096-character limit.
  telegram.tmpl: |
{{ .Files.Get "files/telegram.tmpl" | replace "__GRAFANA_ORIGIN__" (printf "https://%s" .Values.grafana.host) | indent 4 }}
{{- end }}
