{{- if and .Values.observability.enabled .Values.observability.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-alert-gateway
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-alert-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: {{ .Values.observability.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.observability.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: telegram-alert-gateway-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: core-platform/telegram-alert-gateway
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-alert-gateway-registry
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-alert-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: {{ .Values.observability.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.observability.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: telegram-alert-gateway-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}","auth":"{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: applications/dotnet-template/registry
        property: REGISTRY_USER
    - secretKey: password
      remoteRef:
        key: applications/dotnet-template/registry
        property: REGISTRY_TOKEN
{{- end }}
