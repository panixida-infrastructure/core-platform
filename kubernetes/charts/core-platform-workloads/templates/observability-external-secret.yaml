{{- if and .Values.observability.enabled .Values.observability.externalSecrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.observability.externalSecrets.serviceAccountName }}
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.observability.externalSecrets.secretStoreName }}
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  provider:
    vault:
      server: {{ .Values.observability.externalSecrets.openbao.server | quote }}
      path: {{ .Values.observability.externalSecrets.openbao.path | quote }}
      version: {{ .Values.observability.externalSecrets.openbao.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.observability.externalSecrets.openbao.authMountPath | quote }}
          role: {{ .Values.observability.externalSecrets.openbao.role | quote }}
          serviceAccountRef:
            name: {{ .Values.observability.externalSecrets.serviceAccountName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: {{ .Values.observability.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.observability.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.observability.secretName }}
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: {{ .Values.observability.externalSecrets.openbao.remoteKey }}
{{- end }}
