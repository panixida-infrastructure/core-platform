              "expr": "sum by (service_name) (aspnetcore_components_circuit_connected{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"})",
              "legendFormat": "{{`{{service_name}} connected`}}",
              "refId": "B",
              "range": true,
              "instant": false
            }
          ],
          "description": "Active circuits include retained disconnected circuits. Circuits are not unique users."
        },
        {
          "id": 122,
          "title": "Retained disconnected circuits",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-metrics-datasource",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 223
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "clamp_min(sum by (service_name) (aspnetcore_components_circuit_active{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}) - sum by (service_name) (aspnetcore_components_circuit_connected{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}), 0)",
              "legendFormat": "{{`{{service_name}}`}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "description": "Active minus connected. Compare with server RSS/GC; dividing RSS by circuits does not measure memory per user."
        },
        {
          "id": 123,
          "title": "Завершённые circuits: время жизни p95 и количество",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-metrics-datasource",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 231
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.axisLabel",
                    "value": "Завершено / 15 мин"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(aspnetcore_components_circuit_duration_seconds_bucket{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}[15m])))",
              "legendFormat": "{{`{{service_name}} lifetime p95`}}",
              "refId": "A",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "expr": "sum by(service_name)(increase(aspnetcore_components_circuit_duration_seconds_count{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}[15m])) or on(service_name) (0 * sum by(service_name)(aspnetcore_components_circuit_active{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}))",
              "legendFormat": "{{`{{service_name}} completed / 15 min`}}",
              "range": true,
              "instant": false
            }
          ],
          "description": "Левая ось: p95 времени жизни завершённых серверных circuits, в секундах. Правая: число завершений за 15 минут. При 0 завершений p95 не определяется — это нормальный простой, а не ошибка сбора. Открытые circuits в длительность ещё не входят. Отсутствующие измерения длительности не заменяются нулём."
        },
        {
          "id": 124,
          "title": "Blazor Server: обработчики и рендер (p95)",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-metrics-datasource",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 231
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "C"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.axisLabel",
                    "value": "Операций / 5 мин"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "D"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.axisLabel",
                    "value": "Операций / 5 мин"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(aspnetcore_components_handle_event_duration_seconds_bucket{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}[5m])))",
              "legendFormat": "{{`{{service_name}} handlers p95`}}",
              "refId": "A",
              "range": true,
              "instant": false
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(aspnetcore_components_render_diff_duration_seconds_bucket{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}[5m])))",
              "legendFormat": "{{`{{service_name}} render p95`}}",
              "refId": "B",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "expr": "sum by(service_name)(increase(aspnetcore_components_handle_event_duration_seconds_count{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}[5m])) or on(service_name) (0 * sum by(service_name)(aspnetcore_components_circuit_active{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}))",
              "legendFormat": "{{`{{service_name}} handlers / 5 min`}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "D",
              "expr": "sum by(service_name)(increase(aspnetcore_components_render_diff_duration_seconds_count{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}[5m])) or on(service_name) (0 * sum by(service_name)(aspnetcore_components_circuit_active{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}))",
              "legendFormat": "{{`{{service_name}} render / 5 min`}}",
              "range": true,
              "instant": false
            }
          ],
          "description": "Левая ось: p95 длительности обработки событий и построения render diff на сервере, в секундах. Примерно 95% измерений укладываются в это время. Обработчики включают бизнес-логику и ожидание async-вызовов. Это не время загрузки страницы и не отрисовка браузерного кадра. Правая ось: число операций за 5 минут; при отсутствии операций линии p95 нет."
        },
        {
          "id": 130,
          "title": "YARP proxy forwarding",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 239
          }
        },
        {
          "id": 131,
          "title": "Active YARP forwarding requests",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-metrics-datasource",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 240
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (service_name, deployment_environment_name) (yarp_proxy_active_requests{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"})",
              "legendFormat": "{{`{{service_name}} {{deployment_environment_name}}`}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "description": "In-flight forwarded requests in the BFF/proxy. Only services using YARP produce this metric; zero is valid after observed requests finish. Services without YARP remain empty."
        },
        {
          "id": 132,
          "title": "YARP forwarding errors/sec by reason",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-metrics-datasource",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 240
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (service_name, deployment_environment_name, error_type) (rate(yarp_proxy_errors_total{service_namespace!=\"browser\",service_name=~\"${service:regex}\",deployment_environment_name=~\"${environment:regex}\",service_instance_id=~\"${instance:regex}\"}[5m]))",
              "legendFormat": "{{`{{service_name}} {{deployment_environment_name}} {{error_type}}`}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "description": "ForwarderError reasons such as Request and RequestCanceled, not HTTP 4xx/5xx returned by the destination. No error series is created until an error is observed. A rate requires multiple samples; absence is not replaced with a fabricated error count."
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
