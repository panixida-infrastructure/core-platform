        },
        {
          "id": 15,
          "title": "How release monitoring works",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "Stable release sources are checked every 24 hours; failed sources retry hourly. Installed versions refresh every 5 minutes. New versions produce an informational notification in **Core Platform (960)**; the persistent state prevents daily repeats and repeats after collector restarts.\n\n**Available** means that an upstream release exists, not that its image, chart, database migration or plugin is compatible. SonarQube requires checking the custom branch plugin. Redis and Envoy are bundled dependencies. Timeweb Kubernetes/PostgreSQL use the provider catalog; Timeweb node add-ons are shown as a bundle. Own application builds use their project delivery pipelines.\n\nThe monitor does not install updates, scan CVEs or inspect Linux package updates. A failed source stays visible with its last successful check. The notification event lasts one hour; prolonged notification-pipeline outages may miss that notification, while the table retains the available version."
