                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "maxDataPoints": 2000
        },
        {
          "id": 45,
          "type": "text",
          "title": "About Timeweb backups",
          "gridPos": {
            "x": 16,
            "y": 90,
            "w": 8,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "Timeweb creates the physical backups. This collector only reads the API.\n\nAutomatic schedule: **daily**, configured retention: **one automatic copy**. Manual copies are tracked separately.\n\n**No data** is not a healthy backup result: check API polling first. Successful means provider status `done`; restoration is not tested by these metrics. Dates use `created_at`.\n\nMetric history starts when this collector was deployed. For a newly deployed collector, use a short time range (for example, Last 1 hour); there is no earlier monitoring history."
          }
        }
        {{- end }}
