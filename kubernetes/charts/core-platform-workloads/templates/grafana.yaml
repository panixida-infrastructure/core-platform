{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.grafana.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
data:
  datasources.yml: |
    apiVersion: 1
    deleteDatasources:
      - name: VictoriaMetrics Native
        orgId: 1
    prune: true
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: victoriametrics-metrics-datasource
        access: proxy
        url: http://victoriametrics.observability.svc.cluster.local:8428
        isDefault: true
        basicAuth: true
        basicAuthUser: ${OBSERVABILITY_VM_REMOTE_WRITE_USERNAME}
        secureJsonData:
          basicAuthPassword: ${OBSERVABILITY_VM_REMOTE_WRITE_PASSWORD}
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victorialogs.observability.svc.cluster.local:9428
        basicAuth: true
        basicAuthUser: ${OBSERVABILITY_VM_REMOTE_WRITE_USERNAME}
        jsonData:
          logLevelRules:
            # Keep regexes compatible with both JavaScript (log rows) and RE2
            # (Logs volume). JavaScript does not support the inline (?i) flag.
            - field: severity_text
              value: '^([Cc][Rr][Ii][Tt]([Ii][Cc][Aa][Ll])?|[Ff][Aa][Tt][Aa][Ll][2-4]?|[Dd]?[Pp][Aa][Nn][Ii][Cc])$'
              level: critical
              operator: regex
              enabled: true
            - field: severity_text
              value: '^[Ee][Rr][Rr]([Oo][Rr][2-4]?)?$'
              level: error
              operator: regex
              enabled: true
            - field: severity_text
              value: '^[Ww][Aa][Rr][Nn]([2-4]|[Ii][Nn][Gg])?$'
              level: warning
              operator: regex
              enabled: true
            - field: severity_text
              value: '^[Ii][Nn][Ff][Oo]([2-4]|[Rr][Mm][Aa][Tt][Ii][Oo][Nn]([Aa][Ll])?)?$'
              level: info
              operator: regex
              enabled: true
            - field: severity_text
              value: '^[Dd][Ee][Bb][Uu][Gg][2-4]?$'
              level: debug
              operator: regex
              enabled: true
            - field: severity_text
              value: '^[Tt][Rr][Aa][Cc][Ee][2-4]?$'
              level: trace
              operator: regex
              enabled: true
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: victoriatraces
              url: '$${__value.raw}'
              urlDisplayLabel: View trace
            - name: service_name
              matcherType: label
              matcherRegex: service.name
        secureJsonData:
          basicAuthPassword: ${OBSERVABILITY_VM_REMOTE_WRITE_PASSWORD}
      - name: VictoriaTraces
        uid: victoriatraces
        type: jaeger
        access: proxy
        url: http://victoriatraces.observability.svc.cluster.local:10428/select/jaeger
        jsonData:
          tracesToLogsV2:
            datasourceUid: victorialogs
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            filterBySpanID: false
            customQuery: true
            query: 'trace_id:="$${__trace.traceId}"'
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://alertmanager.observability.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: true
