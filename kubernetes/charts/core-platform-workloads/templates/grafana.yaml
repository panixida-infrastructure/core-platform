          "title": "Reading background work metrics",
          "type": "text",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 214
          },
          "options": {
            "mode": "markdown",
            "content": "Inbox/outbox and scheduled total are native Wolverine metrics. DLQ inventory/age, due messages and recurring state require the Core persistence metrics release. Empty means **not measured**, unless an observed queue reports zero.\n\n`IScheduler` and Wolverine recurring commands share durable delayed-message storage. Quartz is a separate job scheduler. Services without a scheduler have no corresponding series.\n\nQueue inventory is shared across replicas (max); event counters and active Quartz jobs are summed. DLQ age starts at original send time. Recurring delay tracks the next occurrence, not business success.\n\nQuartz duration is the mean of completed executions over 15 minutes, calculated from sum/count independently of histogram bucket boundaries. No telemetry freshness alerts are configured."
          }
        },
