              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "fillOpacity": 5,
                "spanNulls": false,
                "showPoints": "auto",
                "pointSize": 5
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Automatic age limit"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(time() - (timeweb_postgres_backup_last_success_timestamp_seconds > 0)) / 3600 and on (db_cluster_id) (timeweb_postgres_backup_poll_success == 1) and on (db_cluster_id) (time() - timeweb_postgres_backup_poll_last_success_timestamp_seconds < 3600)",
              "legendFormat": "{{`{{backup_type}}`}}",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "timeweb_postgres_backup_max_age_seconds / 3600",
              "legendFormat": "Automatic age limit",
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "maxDataPoints": 2000
        },
        {
          "id": 42,
          "title": "Physical backup inventory",
          "description": "Provider inventory by backup type and state. Only done is treated as successful.",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-metrics-datasource",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "x": 0,
