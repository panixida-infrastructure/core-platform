{{- if and .Values.observability.enabled .Values.observability.releases.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: infrastructure-releases
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
data:
  collector.py: |
    {{- .Files.Get "files/infrastructure_releases.py" | nindent 4 }}
  catalog.json: |
    {{- $catalog := .Files.Get "files/infrastructure-releases.json" | fromJson }}
    {{- $_ := set $catalog "kubernetesClusterId" (.Values.observability.controlPlane.clusterId | int64) }}
    {{- $_ := set $catalog "databaseClusterId" (.Values.observability.postgresBackups.clusterId | int64) }}
    {{- $_ := set $catalog "valkeyClusterId" (.Values.observability.valkey.clusterId | int64) }}
    {{- $catalog | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infrastructure-releases
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: core-platform-infrastructure-releases
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core-platform-infrastructure-releases
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: core-platform-infrastructure-releases
subjects:
  - kind: ServiceAccount
    name: infrastructure-releases
    namespace: {{ .Values.observability.namespace }}
---
{{- if .Values.observability.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infrastructure-releases
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.observability.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.observability.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: infrastructure-releases
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.observability.releases.remoteKey }}
        property: TIMEWEB_TOKEN
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infrastructure-releases
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.observability.storageClassName }}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-releases
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: infrastructure-releases
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: infrastructure-releases
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrastructure-releases
        app.kubernetes.io/part-of: core-platform
      annotations:
        checksum/code: {{ .Files.Get "files/infrastructure_releases.py" | sha256sum }}
        checksum/catalog: {{ printf "%s-%v-%v-%v" (.Files.Get "files/infrastructure-releases.json") .Values.observability.controlPlane.clusterId .Values.observability.postgresBackups.clusterId .Values.observability.valkey.clusterId | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: infrastructure-releases
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: infrastructure-releases
          image: {{ .Values.observability.releases.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: [python, -B, /app/collector.py]
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: state
              mountPath: /state
            - name: timeweb-token
              mountPath: /var/run/timeweb
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: infrastructure-releases
        - name: state
          persistentVolumeClaim:
            claimName: infrastructure-releases
        - name: timeweb-token
          secret:
            secretName: infrastructure-releases
            defaultMode: 0440
{{- end }}
