{{- if and .Values.observability.enabled .Values.observability.postgresBackups.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: timeweb-postgres-backup-code
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
data:
  collector.py: |
    {{- .Files.Get "files/timeweb_postgres_backups.py" | nindent 4 }}
---
{{- if .Values.observability.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: timeweb-postgres-backups
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.observability.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.observability.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.observability.postgresBackups.secretName }}
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.observability.postgresBackups.remoteKey }}
        property: TIMEWEB_TOKEN
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeweb-postgres-backups
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "core-platform-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/name: timeweb-postgres-backups
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: timeweb-postgres-backups
      app.kubernetes.io/part-of: core-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timeweb-postgres-backups
        app.kubernetes.io/part-of: core-platform
      annotations:
        checksum/code: {{ .Files.Get "files/timeweb_postgres_backups.py" | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: timeweb-postgres-backups
          image: {{ .Values.observability.postgresBackups.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: [python, -B, /app/collector.py]
          env:
            - name: TIMEWEB_DATABASE_CLUSTER_ID
              value: {{ .Values.observability.postgresBackups.clusterId | int64 | quote }}
            - name: TIMEWEB_DATABASE_CLUSTER_NAME
              value: {{ .Values.observability.postgresBackups.clusterName | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.observability.postgresBackups.pollIntervalSeconds | quote }}
            - name: BACKUP_MAX_AGE_SECONDS
              value: {{ .Values.observability.postgresBackups.maxAgeSeconds | int64 | quote }}
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: timeweb-token
              mountPath: /var/run/timeweb
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: timeweb-postgres-backup-code
        - name: timeweb-token
          secret:
            secretName: {{ .Values.observability.postgresBackups.secretName }}
            defaultMode: 0440
{{- end }}
