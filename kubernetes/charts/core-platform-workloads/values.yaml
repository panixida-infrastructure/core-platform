global:
  imagePullPolicy: IfNotPresent
  gateway:
    name: core-platform
    namespace: envoy-gateway-system
    httpSectionName: http
    httpsSectionNames:
      identity: identity-https
      secrets: secrets-https
      grafana: grafana-https
      sonar: sonar-https

keycloak:
  enabled: true
  namespace: identity
  host: identity.panixida.ru
  image: quay.io/keycloak/keycloak:26.8.0
  secretName: keycloak-secrets
  replicas: 1
  sso:
    adminUsers:
      - admin
    viewerUsers: []
  cache:
    type: local
    stack: ""
  jgroupsCleanup:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

openbao:
  enabled: true
  namespace: secrets
  host: secrets.panixida.ru
  image: openbao/openbao:2.7.1
  secretName: openbao-secrets
  staticSeal:
    enabled: true
    secretName: openbao-static-seal
    key: OPENBAO_STATIC_SEAL_KEY
    currentKeyId: static-20260613-1
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

grafana:
  enabled: true
  namespace: observability
  host: grafana.panixida.ru
  image: grafana/grafana:13.2.3
  secretName: grafana-secrets
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 768Mi

sonarqube:
  enabled: true
  namespace: quality
  host: sonar.panixida.ru
  image: public.ecr.aws/docker/library/sonarqube:26.9.0.129388-community
  # TODO: replace the 26.9 fork with a compatible mc1arke release after staging verification.
  branchPlugin:
    enabled: true
    sourceCommit: a68cf75cc414a0725e54ec73d7a1ff6d51afadd7
    jarName: sonarqube-community-branch-plugin-26.9.0-SNAPSHOT.jar
    jarUrl: https://github.com/panixida-infrastructure/core-platform/releases/download/sonarqube-26.9-cbp-a68cf75/sonarqube-community-branch-plugin-26.9.0-SNAPSHOT.jar
    jarSha256: 9b34223d7c8096e7b5ccd12e7f42d041f5fec269259c48aed6eec3aeb7965edf
    webappUrl: https://github.com/panixida-infrastructure/core-platform/releases/download/sonarqube-26.9-cbp-a68cf75/sonarqube-webapp.zip
    webappSha256: decd691b9529ad966c6d68385566521e0b6bef174343985b045a7d9eb65b1f9d
  newCodeDays: 30
  secretName: sonarqube-secrets
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    serviceAccountName: sonarqube-external-secrets
    secretStoreName: sonarqube
    openbao:
      server: http://openbao.secrets.svc.cluster.local:8200
      path: secret
      version: v2
      authMountPath: kubernetes
      role: sonarqube
      remoteKey: core-platform/sonarqube
  githubIntegration:
    enabled: true
    key: GitHub
    apiUrl: https://api.github.com
  javaOpts:
    web: -Xms128m -Xmx384m
    ce: -Xms128m -Xmx384m
    search: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=128m
  persistence:
    enabled: true
  storageClassName: nvme.network-drives.csi.timeweb.cloud
  storageSize: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 2560Mi
    limits:
      memory: 4Gi

observability:
  enabled: true
  namespace: observability
  secretName: observability-secrets
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    serviceAccountName: observability-external-secrets
    secretStoreName: observability
    openbao:
      server: http://openbao.secrets.svc.cluster.local:8200
      path: secret
      version: v2
      authMountPath: kubernetes
      role: observability
      remoteKey: core-platform/observability
  nodeExporter:
    enabled: true
  controlPlane:
    enabled: true
    clusterId: 1091532
    nodeExporterTargets:
      - address: local-k8s-ax71701-1091532.twc1.net:9100
        instance: master-192.168.10.5
    logs:
      enabled: true
      secretName: timeweb-control-plane-logs
      remoteKey: core-platform/observability-timeweb-logs
      pollIntervalSeconds: 60
      # Confirmed operator VPN egress; unknown peers still produce Error alerts.
      diagnosticClientIPs:
        - 176.53.162.227
      image: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  persistence:
    enabled: true
  storageClassName: nvme.network-drives.csi.timeweb.cloud
  httpCheckTargets:
    - https://argocd.panixida.ru
    - https://k8s.panixida.ru
    - https://kargo.panixida.ru
    - https://identity.panixida.ru
    - https://secrets.panixida.ru
    - https://grafana.panixida.ru
    - https://sonar.panixida.ru
    - https://dev.api.dotnet-template.panixida.ru/health
    - https://api.dotnet-template.panixida.ru/health
    - https://dev.api.tactical-heroes.panixida.ru/health
    - https://api.tactical-heroes.panixida.ru/health
    - https://dev.tactical-heroes.panixida.ru/health
    - https://tactical-heroes.panixida.ru/health
    - http://telegram-alert-gateway.observability.svc.cluster.local/health/ready
  alerts:
    telegram:
      chatId: "-1003738995665"
      topics:
        tactical-heroes: 955
        dotnet-template: 956
        postgresql: 958
        core-platform: 960
        observability: 962
        unclassified: 964
        tests: 10662
  telegramEgress:
    vpnReplicas: 1
    proxyReplicas: 2
  images:
    victoriametrics: victoriametrics/victoria-metrics:v1.153.0
    victorialogs: victoriametrics/victoria-logs:v1.53.0
    victoriatraces: victoriametrics/victoria-traces:v0.12.0
    vmalert: victoriametrics/vmalert:v1.153.0
    alertmanager: prom/alertmanager:v0.34.1
    nodeExporter: quay.io/prometheus/node-exporter:v1.12.1
    otelCollector: otel/opentelemetry-collector-contrib:0.161.0
    gluetun: ghcr.io/qdm12/gluetun:v3.41.3
    squid: ubuntu/squid:7.2-26.04_edge
    busybox: busybox:1.37.0
  storage:
    victoriametrics: 20Gi
    victorialogs: 10Gi
    victoriatraces: 10Gi
    alertmanager: 2Gi
  resources:
    victoriametrics:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    victorialogs:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    victoriatraces:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    vmalert:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    alertmanager:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    nodeExporter:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
    otelCollector:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    otelLogs:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    telegramVpn:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    telegramEgress:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    telegramEgressLogForwarder:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        memory: 32Mi
